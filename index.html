<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E1116">
<meta name="description" content="Сервис — приёмка автомобиля: неисправности, смета, акт приёма и акт сдачи работ.">
<title>Сервис — приёмка автомобилей</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
:root{
  --bg:#0E1116; --bg2:#12161C; --panel:#171C23; --panel2:#1E242C; --line:#2A313B;
  --ink:#EDF1F6; --muted:#96A3B4; --dim:#6C7889;
  --accent:#FFC24B; --accent-2:#FFD37A; --accent-ink:#1A1405;
  --ok:#3BD67F; --info:#6FA8DC; --bad:#FF6B6B;
  --r:16px;
}
body{
  background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  font-size:15px;line-height:1.45;
  padding-bottom:calc(225px + env(safe-area-inset-bottom));
}
a{color:inherit;text-decoration:none}
button{font-family:inherit}
h1,h2,h3{letter-spacing:-.02em}
.wrap{max-width:560px;margin:0 auto;padding:0 14px}

/* topbar */
.topbar{position:sticky;top:0;z-index:30;background:rgba(14,17,22,.9);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.topbar .row{max-width:560px;margin:0 auto;padding:9px 14px;display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-mark{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:rgba(255,194,75,.12);border:1px solid rgba(255,194,75,.28);flex:0 0 auto}
.brand-mark svg{width:26px;height:26px;stroke:var(--accent);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.brand-name{font-weight:800;font-size:16px;letter-spacing:-.02em}
.brand-sub{font-size:11.5px;color:var(--dim);font-weight:600}

/* tabs */
.seg{display:flex;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:4px;margin-top:12px}
.seg a{flex:1;text-align:center;padding:9px 8px;border-radius:10px;font-size:13.5px;font-weight:700;color:var(--muted)}
.seg a.on{background:var(--panel2);color:var(--ink);box-shadow:inset 0 0 0 1px #33404F}
.seg .n{color:var(--dim);font-weight:700;margin-left:4px}

/* head */
.page-head{display:flex;align-items:center;gap:10px;margin:14px 0 10px}
.back{width:38px;height:38px;flex:0 0 auto;border-radius:11px;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;color:var(--muted);cursor:pointer}
.back svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.crumb{font-size:11.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.07em;font-weight:700}
.page-title{font-size:22px;font-weight:800;letter-spacing:-.03em;margin-top:1px}
.h1{font-size:24px;font-weight:800;letter-spacing:-.03em}

/* lists */
.section{margin-top:16px}
.section-head{display:flex;align-items:baseline;gap:8px;margin-bottom:8px}
.section-head h2{font-size:12.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.dim{color:var(--dim);font-size:12px}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:block;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 13px;cursor:pointer;color:inherit}
.item:active{background:var(--panel2)}
.item-row{display:flex;align-items:center;gap:8px}
.plate{font-size:16.5px;font-weight:800;letter-spacing:-.02em}
.amount{font-size:16.5px;font-weight:800;margin-left:auto;white-space:nowrap}
.sub{font-size:13px;color:var(--muted);margin-top:3px}
.when{font-size:12px;color:var(--dim);margin-top:6px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;padding:3px 7px;border-radius:6px;border:1px solid transparent;white-space:nowrap}
.pill::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor}
.pill.draft{color:var(--accent);background:rgba(255,194,75,.12);border-color:rgba(255,194,75,.3)}
.pill.signed{color:var(--info);background:rgba(111,168,220,.12);border-color:rgba(111,168,220,.3)}
.pill.closed{color:var(--ok);background:rgba(59,214,127,.11);border-color:rgba(59,214,127,.26)}

/* meta */
.meta-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.meta{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:9px 11px}
.meta .k{font-size:10.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.meta .v{font-weight:700;margin-top:2px;font-size:14px}
.hint{font-size:13px;color:var(--dim);line-height:1.5}

/* groups */
.grp{background:var(--panel);border:1px solid var(--line);border-radius:14px;margin-top:9px;overflow:hidden}
.grp-head{display:flex;align-items:center;gap:8px;padding:10px 12px}
.grp-name{font-weight:800;font-size:13.5px}
.grp-count{color:var(--dim);font-size:12px;font-weight:700}
.grp-clean{margin-left:auto;border:1px solid var(--line);background:transparent;color:var(--dim);font-size:11.5px;font-weight:700;padding:5px 9px;border-radius:8px;cursor:pointer}
.grp-clean.on{color:var(--ok);border-color:rgba(59,214,127,.35);background:rgba(59,214,127,.1)}
.pos{padding:10px 12px;border-top:1px solid var(--line);display:flex;gap:10px;cursor:pointer}
.pos-name{font-weight:700;font-size:14px}
.pos-sub{font-size:12.5px;color:var(--muted);margin-top:2px}
.pos-note{font-size:12px;color:var(--dim);margin-top:3px}
.pos-price{margin-left:auto;font-weight:800;white-space:nowrap;font-size:14px}
.tag{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.03em;text-transform:uppercase;padding:2px 6px;border-radius:5px;margin-right:6px;border:1px solid var(--line);color:var(--muted)}
.tag.rep{color:var(--info);border-color:rgba(111,168,220,.3)}
.tag.rep2{color:var(--accent);border-color:rgba(255,194,75,.3)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:46px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);font-weight:700;font-size:14.5px;cursor:pointer}
.btn:active{transform:scale(.99)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:rgba(255,107,107,.35);background:rgba(255,107,107,.07)}
.btn.sm{height:36px;padding:0 12px;font-size:13px;border-radius:10px}
.btn.block{width:100%}
.btn.wide{flex:1 1 100%}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.actions .btn{flex:1 1 auto}

/* dock */
.dock{position:fixed;left:0;right:0;bottom:calc(76px + env(safe-area-inset-bottom));z-index:35;pointer-events:none}
.dock .inner{max-width:560px;margin:0 auto;padding:0 14px;pointer-events:auto}
.dock .card{background:rgba(23,28,35,.96);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:15px;padding:9px 10px;display:flex;align-items:center;gap:10px;box-shadow:0 12px 30px rgba(0,0,0,.45)}
.dock .sum{font-weight:800;font-size:15px;line-height:1.15}
.dock .cnt{font-size:11.5px;color:var(--dim);font-weight:600}
.dock .btn{margin-left:auto}

/* tabbar */
.tabbar{position:fixed;bottom:0;left:0;right:0;z-index:40;background:rgba(17,22,29,.96);backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:7px 10px calc(7px + env(safe-area-inset-bottom))}
.tabbar .inner{display:flex;max-width:560px;margin:0 auto;gap:2px}
.tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:11px;color:var(--dim);font-size:10.5px;font-weight:700;white-space:nowrap}
.tabbar a.on{color:var(--accent);background:rgba(255,194,75,.09)}
.tabbar svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabbar .mid{max-width:96px;font-size:9.5px}
.tabbar .mid .dot{width:38px;height:38px;margin-top:-13px;border-radius:13px;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);box-shadow:0 6px 16px rgba(255,194,75,.3)}
.tabbar .mid .dot svg{width:22px;height:22px;stroke-width:2.4}

/* empty */
.empty{text-align:center;padding:30px 16px;border:1px dashed #33404F;border-radius:14px;background:rgba(23,28,35,.5)}
.empty h3{font-size:15px;margin-bottom:5px}
.empty p{color:var(--muted);font-size:13px;max-width:32ch;margin:0 auto 13px}

/* sheet */
.backdrop{position:fixed;inset:0;z-index:60;background:rgba(6,8,11,.72);backdrop-filter:blur(3px);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;background:var(--bg2);border:1px solid var(--line);border-radius:20px 20px 0 0;max-height:93vh;display:flex;flex-direction:column;animation:up .22s cubic-bezier(.2,.8,.3,1)}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
.grabber{width:38px;height:4px;border-radius:99px;background:#3A4655;margin:9px auto 0;flex:0 0 auto}
.sheet-head{padding:12px 16px 8px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.sheet-head h3{font-size:17px;font-weight:800}
.sheet-body{padding:4px 16px 6px;overflow:auto;flex:1;min-height:0}
.sheet-foot{padding:10px 16px calc(14px + env(safe-area-inset-bottom));display:flex;gap:8px;border-top:1px solid var(--line);background:var(--bg2);flex-wrap:wrap}
.sheet-foot .btn{flex:1}
.x{border:none;background:transparent;color:var(--dim);font-size:22px;line-height:1;cursor:pointer;padding:4px 6px}

/* fields */
.field{margin-bottom:11px}
.field label{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:5px}
.field input,.field textarea,.field select{width:100%;background:#0F141A;border:1px solid var(--line);border-radius:11px;padding:11px 12px;font-size:16px;color:var(--ink);outline:none}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(255,194,75,.15)}
.field textarea{min-height:56px;resize:vertical;line-height:1.45}
.field input.err{border-color:var(--bad)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--panel2);color:var(--muted);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:700;cursor:pointer}
.chip.on{border-color:var(--accent);background:rgba(255,194,75,.14);color:var(--accent)}
.chip.add{border-style:dashed;color:var(--dim)}

/* photos */
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:8px}
.photo{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:#0B0E12}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.photo .del{position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:7px;border:none;background:rgba(8,10,13,.75);color:#fff;font-size:14px;line-height:1;cursor:pointer}
.photo.add{display:grid;place-items:center;border-style:dashed;color:var(--dim);cursor:pointer;background:transparent}
.photo.add span{font-size:22px;line-height:1}

/* signature */
.sigwrap{background:#0B0F14;border:1px solid var(--line);border-radius:12px;overflow:hidden;touch-action:none}
.sigwrap canvas{display:block;width:100%;height:160px;touch-action:none;cursor:crosshair}
.sigline{display:flex;justify-content:space-between;font-size:11px;color:var(--dim);padding:6px 10px;border-top:1px dashed #2E3A48}

/* toast */
#toast{position:fixed;left:50%;bottom:calc(170px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:max-content;max-width:90vw}
.toast{background:#232C38;border:1px solid #3A4655;color:var(--ink);padding:10px 15px;border-radius:11px;font-size:13px;font-weight:700;box-shadow:0 10px 30px rgba(0,0,0,.45)}

/* print */
#printRoot{display:none}
@media print{
  @page{size:A4;margin:12mm}
  body{background:#fff;padding:0;color:#111}
  .topbar,.tabbar,.dock,#toast,.backdrop,#app{display:none!important}
  #printRoot{display:block!important}
}
.doc{color:#111;font-family:Arial,Helvetica,sans-serif;font-size:10.5pt;line-height:1.4}
.doc h1{font-size:14pt;margin-bottom:2px}
.doc .doc-top{display:flex;justify-content:space-between;border-bottom:2px solid #111;padding-bottom:7px;margin-bottom:12px}
.doc .who{font-size:9pt;color:#333;text-align:right;max-width:46%}
.doc h2{font-size:10.5pt;margin:13px 0 5px;text-transform:uppercase;letter-spacing:.05em}
.doc .kv{display:flex;gap:8px;margin-bottom:2px}
.doc .kv b{font-weight:700;min-width:112px;display:inline-block}
.doc table{width:100%;border-collapse:collapse;margin-top:5px}
.doc th,.doc td{border:1px solid #999;padding:5px 7px;text-align:left;font-size:9pt;vertical-align:top}
.doc th{background:#eee;font-weight:700}
.doc td.num,.doc th.num{text-align:right;white-space:nowrap}
.doc tfoot td{font-weight:700;background:#f6f6f6}
.doc .totals{margin-top:8px;display:flex;justify-content:flex-end;gap:26px;font-size:10pt}
.doc .totals b{display:block;font-size:11pt}
.doc .note{margin-top:10px;font-size:8.8pt;color:#333;line-height:1.45}
.doc .signs{display:flex;gap:26px;margin-top:24px;page-break-inside:avoid}
.doc .signs>div{flex:1}
.doc .signs .ln{border-bottom:1px solid #111;height:44px;display:flex;align-items:flex-end;padding-bottom:2px}
.doc .signs .ln img{height:42px;display:block}
.doc .signs .cap{font-size:8.5pt;color:#444;margin-top:4px;display:flex;justify-content:space-between;gap:6px}
</style>

  <div class="row">

<script>(()=>{
'use strict';
/* ================= utils ================= */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const E={'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'};
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>E[c]);
const uid=()=>Math.random().toString(36).slice(2,7)+Date.now().toString(36).slice(-3);
const nOf=v=>{const x=parseFloat(String(v==null?'':v).replace(/\s/g,'').replace(',','.'));return isFinite(x)?x:0;};
const money=n=>Math.round(Number(n)||0).toLocaleString('ru-RU')+' ₽';
const dmy=ts=>ts?new Date(ts).toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit',year:'numeric'}):'—';
const dtm=ts=>ts?new Date(ts).toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}):'—';
const plur=(n,a,b,c)=>{const m=Math.abs(n)%100,k=m%10;return m>10&&m<20?c:k===1?a:k>1&&k<5?b:c;};
const fmtPhone=v=>{const d=String(v||'').replace(/\D/g,'');return (d.length===11&&d[0]==='7')?'+7 ('+d.slice(1,4)+') '+d.slice(4,7)+'-'+d.slice(7,9)+'-'+d.slice(9):(v||'');};

/* ================= constants ================= */
const GROUPS=['Кузов','Подвеска','Двигатель и охлаждение','Электрика','Прочее'];
const DAMAGES=['Вмятина','Царапина','Трещина','Течь','Не работает','Разбито'];
const MODES={repair:'Ремонт',replace:'Замена'};
const STATUS={draft:'Осмотр',signed:'Подписан',closed:'Выдан'};
const KEY='priemka.v2', KEY_OLD='priemka.v1';
const ZONES_OLD={front:'Передний бампер',hood:'Капот',left:'Левый борт',roof:'Крыша',right:'Правый борт',rear:'Задний бампер',glass:'Стёкла',wheels:'Диски и шины',salon:'Салон'};
const ACT_NOTE='Владелец подтверждает, что перечисленные повреждения зафиксированы при приёмке автомобиля, до начала работ. Стоимость запчастей указана предварительно и уточняется после дефектовки.';

let S=null, draftPhotos=[], statsMonth=null, statsDay=null;

/* ================= photo store ================= */
const PhotoDB=(()=>{let p=null;
  const open=()=>p||(p=new Promise((res,rej)=>{const r=indexedDB.open('priemka',1);
    r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains('p'))r.result.createObjectStore('p');};
    r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);}));
  return{
    async put(id,v){try{const db=await open();return await new Promise((res,rej)=>{const t=db.transaction('p','readwrite');t.objectStore('p').put(v,id);t.oncomplete=()=>res(1);t.onerror=()=>rej(t.error);});}catch(e){return 0;}},
    async get(id){try{const db=await open();return await new Promise(res=>{const r=db.transaction('p').objectStore('p').get(id);r.onsuccess=()=>res(r.result||null);r.onerror=()=>res(null);});}catch(e){return null;}},
    async del(id){try{const db=await open();return await new Promise(res=>{const t=db.transaction('p','readwrite');t.objectStore('p').delete(id);t.oncomplete=()=>res(1);t.onerror=()=>res(0);});}catch(e){return 0;}}
  };
})();

/* ================= state ================= */
function blank(){return{v:2,me:{name:'',phone:''},groups:GROUPS.slice(),cars:[]};}
function load(){
  try{const raw=localStorage.getItem(KEY);if(raw){S=JSON.parse(raw);S.groups=S.groups&&S.groups.length?S.groups:GROUPS.slice();S.me=Object.assign({name:'',phone:''},S.me||{});S.cars=S.cars||[];return;}}catch(e){}
  try{
    const oldRaw=localStorage.getItem(KEY_OLD);
    if(oldRaw){S=migrate(JSON.parse(oldRaw));save();return;}
  }catch(e){}
  S=blank();save();
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){toast('Хранилище переполнено');}}

function migrate(o){
  const s=blank(); s.me=Object.assign(s.me,o.me||{});
  s.cars=(o.cars||[]).map(c=>{
    const items=[];
    (c.works||[]).forEach(w=>items.push(mkItem({group:'Прочее',part:w.title||'Работа',partPrice:nOf(w.price)*(nOf(w.qty)||1)})));
    Object.keys(c.zones||{}).forEach(k=>{
      const z=c.zones[k]||{}, zname=ZONES_OLD[k]||k;
      Object.keys(z.marks||{}).forEach(m=>{for(let i=0;i<(z.marks[m]||0);i++)items.push(mkItem({group:'Кузов',part:zname,damage:m}));});
      if(z.note)items.push(mkItem({group:'Кузов',part:zname,note:z.note}));
    });
    return {id:c.id||'c_'+uid(),plate:c.plate||'',model:c.model||'',vin:c.vin||'',owner:c.owner||'',phone:c.phone||'',
      mileage:c.mileage||'',note:c.note||'',createdAt:c.createdAt||Date.now(),status:c.status||'draft',
      items,clean:{},sig:c.sig||null,signedAt:c.signedAt||null,handSig:null,handAt:null,closedAt:c.closedAt||null};
  });
  return s;
}
function mkItem(p){return{id:'i_'+uid(),group:p.group||'Прочее',part:p.part||'',damage:p.damage||'',note:p.note||'',
  mode:p.mode||'repair',partPrice:Math.round(nOf(p.partPrice)),labor:Math.round(nOf(p.labor)),photos:p.photos||[]};}

const car=id=>S.cars.find(c=>c.id===id);
const itemsOf=c=>c.items||[];
const partsSum=c=>itemsOf(c).reduce((s,i)=>s+Math.round(i.partPrice||0),0);
const laborSum=c=>itemsOf(c).reduce((s,i)=>s+Math.round(i.labor||0),0);
const rowSum=i=>Math.round(i.partPrice||0)+Math.round(i.labor||0);
const groupsUsed=c=>{const out=[];S.groups.forEach(g=>{if(itemsOf(c).some(i=>i.group===g))out.push(g);});
  itemsOf(c).forEach(i=>{if(out.indexOf(i.group)<0)out.push(i.group);});return out;};
const groupsAll=c=>{const out=S.groups.slice();itemsOf(c).forEach(i=>{if(out.indexOf(i.group)<0)out.push(i.group);});return out;};
const checkedCount=c=>groupsAll(c).filter(g=>c.clean&&c.clean[g]||itemsOf(c).some(i=>i.group===g)).length;
const allParts=()=>{const set={};S.cars.forEach(c=>itemsOf(c).forEach(i=>{if(i.part)set[i.part]=1;}));return Object.keys(set).sort();};

function render(){
  const parts=(location.hash||'#/').replace(/^#\/?/,'').split('/').filter(Boolean);
  let html='',tab='home';
  if(!parts.length){html=vDraft();}
  else if(parts[0]==='signed'){html=vSigned();}
  else if(parts[0]==='cars'){html=vCars();tab='cars';}
  else if(parts[0]==='c'){html=vCar(parts[1]);tab='cars';}
  else if(parts[0]==='stats'){html=vStats();tab='stats';}
  else if(parts[0]==='settings'){html=vSettings();tab='set';}
  else{html='<div class="empty"><h3>Не найдено</h3><p>Такой страницы нет.</p><a class="btn sm primary" href="#/">На осмотры</a></div>';}
  $('#app').innerHTML=html+tabbar(tab);
  hydratePhotos();
}
async function hydratePhotos(){
  for(const img of $$('img[data-ph][data-src="1"]')){
    img.dataset.src='0';
    const src=await PhotoDB.get(img.dataset.ph);
    if(src)img.src=src;
  }
}

const ymKey=ts=>{const d=new Date(ts);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');};
const ymdKey=ts=>ymKey(ts)+'-'+String(new Date(ts).getDate()).padStart(2,'0');
function monthStats(month){
  const days={};
  const get=d=>days[d]||(days[d]={acc:0,accSum:0,sig:0,hand:0,handSum:0});
  S.cars.forEach(c=>{
    if(c.createdAt&&ymKey(c.createdAt)===month){const d=ymdKey(c.createdAt);get(d).acc++;get(d).accSum+=partsSum(c);}
    if(c.signedAt&&ymKey(c.signedAt)===month){get(ymdKey(c.signedAt)).sig++;}
    if(c.closedAt&&ymKey(c.closedAt)===month){const d=ymdKey(c.closedAt);get(d).hand++;get(d).handSum+=partsSum(c)+laborSum(c);}
  });
  return days;
}
function dayEvents(day){
  const out=[];
  S.cars.forEach(c=>{
    if(c.createdAt&&ymdKey(c.createdAt)===day)out.push({t:c.createdAt,kind:'Принята',c});
    if(c.signedAt&&ymdKey(c.signedAt)===day)out.push({t:c.signedAt,kind:'Подписан акт',c});
    if(c.closedAt&&ymdKey(c.closedAt)===day)out.push({t:c.closedAt,kind:'Выдана',c});
  });
  return out.sort((a,b)=>a.t-b.t);
}
function vStats(){
  const now=new Date();
  if(!statsMonth)statsMonth=ymKey(now.getTime());
  if(!statsDay)statsDay=ymdKey(now.getTime());
  const days=monthStats(statsMonth);
  const keys=Object.keys(days).sort();
  const tot={acc:0,accSum:0,sig:0,hand:0,handSum:0};
  keys.forEach(k=>{const d=days[k];tot.acc+=d.acc;tot.accSum+=d.accSum;tot.sig+=d.sig;tot.hand+=d.hand;tot.handSum+=d.handSum;});

  let h='<div class="h1" style="margin-top:14px">Статистика</div>';
  h+='<div class="field" style="margin:12px 0 10px"><label for="st_month">Месяц</label><input id="st_month" type="month" value="'+statsMonth+'"></div>';
  h+='<div class="meta-grid">'
   +'<div class="meta"><div class="k">Принято машин</div><div class="v">'+tot.acc+'</div></div>'
   +'<div class="meta"><div class="k">Запчасти по ним</div><div class="v">'+money(tot.accSum)+'</div></div>'
   +'<div class="meta"><div class="k">Подписано актов</div><div class="v">'+tot.sig+'</div></div>'
   +'<div class="meta"><div class="k">Выдано машин</div><div class="v">'+tot.hand+'</div></div>'
   +'<div class="meta" style="grid-column:1/-1"><div class="k">Выдано на сумму (запчасти + работа)</div><div class="v">'+money(tot.handSum)+'</div></div>'
   +'</div>';

  h+='<div class="section"><div class="section-head"><h2>По дням</h2><span class="dim">'+keys.length+'</span></div>';
  h+=keys.length
    ? '<div class="list">'+keys.map(k=>{
        const d=days[k], parts=[];
        if(d.acc)parts.push('принято '+d.acc);
        if(d.sig)parts.push('подписано '+d.sig);
        if(d.hand)parts.push('выдано '+d.hand);
        const dt=new Date(k+'T12:00:00').getTime();
        return '<div class="item" data-act="stat-day" data-d="'+k+'">'
          +'<div class="item-row"><div class="plate" style="font-size:15px">'+dmy(dt)+'</div>'
          +'<div class="amount" style="font-size:14px">'+(d.handSum?money(d.handSum):(d.accSum?money(d.accSum):'—'))+'</div></div>'
          +'<div class="sub">'+parts.join(' · ')+'</div></div>';
      }).join('')+'</div>'
    : '<div class="empty"><h3>За этот месяц пусто</h3><p>Ни приёмок, ни подписаний, ни выдач.</p></div>';
  h+='</div>';

  const ev=dayEvents(statsDay);
  h+='<div class="section"><div class="section-head"><h2>Любой день</h2></div>'
   +'<div class="field"><input id="st_day" type="date" value="'+statsDay+'"></div>';
  h+=ev.length
    ? '<div class="list">'+ev.map(e=>'<div class="item" role="button" tabindex="0" data-act="go" data-to="#/c/'+e.c.id+'">'
        +'<div class="item-row"><div class="plate" style="font-size:15px">'+esc(e.c.plate||'без номера')+'</div>'
        +'<div class="amount" style="font-size:14px">'+money(partsSum(e.c))+'</div></div>'
        +'<div class="sub">'+e.kind+' · '+new Date(e.t).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})+' · '+esc(e.c.model||'')+'</div></div>').join('')+'</div>'
    : '<div class="hint">В этот день ничего не было.</div>';
  h+='</div>';
  return h;
}

   +'<div class="grabber"></div>'
   +'<div class="sheet-head"><h3>'+o.title+'</h3><button class="x" data-act="close-sheet" aria-label="Закрыть">×</button></div>'

   +'</div></div>';

  if(o.onMount)o.onMount($('.sheet-body',host),sheetCloser);
}

function pickPhotos(){
  const inp=document.createElement('input');
  inp.type='file';inp.accept='image/*';inp.multiple=true;
  inp.onchange=async()=>{
    const files=Array.from(inp.files||[]);
    for(const f of files){
      try{const data=await compress(f);const id='ph_'+uid();await PhotoDB.put(id,data);draftPhotos.push(id);}catch(e){toast('Фото не прочиталось');}
    }
    renderDraftPhotos($('#i_photos'));
  };
  inp.click();
}
function compress(file,maxW=1400,quality=.72){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        const k=Math.min(1,maxW/img.width), w=Math.round(img.width*k), hh=Math.round(img.height*k);
        const cv=document.createElement('canvas');cv.width=w;cv.height=hh;
        cv.getContext('2d').drawImage(img,0,0,w,hh);
        try{res(cv.toDataURL('image/jpeg',quality));}catch(e){rej(e);}
      };
      img.onerror=rej;img.src=fr.result;
    };
    fr.onerror=rej;fr.readAsDataURL(file);
  });
}

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');
  if(!el)return;
  const act=el.dataset.act;
  if(el.tagName==='A')e.preventDefault();
  switch(act){
    case 'go': location.hash=el.dataset.to; break;
    case 'back': history.length>1?history.back():location.hash='#/'; break;
    case 'close-sheet': closeTop(); break;
    case 'new-car': carForm(null); break;
    case 'edit-car': carForm(el.dataset.id); break;
    case 'save-car': {
      const cid=el.dataset.id;
      const plate=$('#c_plate').value.trim().toUpperCase();
      if(!plate){$('#c_plate').classList.add('err');$('#c_plate').focus();toast('Нужен госномер');break;}
      const dateStr=$('#c_date')?$('#c_date').value:'';
      const createdAt=dateStr?new Date(dateStr).getTime():Date.now();
      const data={plate,model:$('#c_model').value.trim(),mileage:$('#c_mileage').value.trim(),
        vin:$('#c_vin').value.trim().toUpperCase(),owner:$('#c_owner').value.trim(),phone:$('#c_phone').value.trim(),
        note:$('#c_note').value.trim(),createdAt:createdAt||Date.now()};
      if(cid){const c=car(cid);Object.assign(c,data);}
      else{
        const c=Object.assign({id:'c_'+uid(),status:'draft',items:[],clean:{},sig:null,signedAt:null,handSig:null,handAt:null,closedAt:null},data);
        S.cars.push(c);
        closeTop();save();location.hash='#/c/'+c.id;render();toast('Машина принята');break;
      }
      closeTop();save();render();toast('Сохранено');break;
    }
    case 'add-item': itemForm(el.dataset.id,null,el.dataset.g); break;
    case 'edit-item': itemForm(el.dataset.id,el.dataset.i); break;
    case 'save-item': {
      const cid=el.dataset.id, iid=el.dataset.i, cont=el.dataset.cont==='1';
      const c=car(cid);if(!c)break;
      const bd=$('.sheet-body');
      const st=bd&&bd._getState?bd._getState():null;
      if(!st){break;}
      if(st.newGroup){ if(S.groups.indexOf(st.newGroup)<0)S.groups.push(st.newGroup); }
      const group=st.newGroup||st.group;
      if(!st.part){$('#i_part').classList.add('err');$('#i_part').focus();toast('Напишите, что за деталь');break;}
      const data={group,part:st.part,damage:st.damage,mode:st.mode,note:st.note,
        partPrice:Math.round(nOf(st.partPrice)),labor:Math.round(nOf(st.labor)),photos:draftPhotos.slice()};
      if(iid){const it=itemsOf(c).find(x=>x.id===iid);Object.assign(it,data);}
      else{c.items.push(Object.assign(mkItem({}),data));delete c.clean[group];}
      save();
      if(cont){ itemForm(cid,null,group); toast('Добавлено · следующая'); }
      else{ closeTop(); render(); toast(iid?'Позиция обновлена':'Добавлено'); }
      break;
    }
    case 'del-item': {
      const cid=el.dataset.id,iid=el.dataset.i;
      const c=car(cid);if(!c)break;
      const it=itemsOf(c).find(x=>x.id===iid);
      (it&&it.photos||[]).forEach(p=>PhotoDB.del(p));
      c.items=itemsOf(c).filter(x=>x.id!==iid);
      save();closeTop();render();toast('Позиция удалена');break;
    }
    case 'clean': {
      const c=car(el.dataset.id);if(!c)break;
      c.clean=c.clean||{};
      const g=el.dataset.g;
      if(c.clean[g])delete c.clean[g];else c.clean[g]=Date.now();
      save();render();break;
    }
    case 'add-photo': pickPhotos(); break;
    case 'del-photo': {
      const i=+el.dataset.i;
      const id=draftPhotos[i];
      if(id)PhotoDB.del(id);
      draftPhotos.splice(i,1);
      renderDraftPhotos($('#i_photos'));
      break;
    }
    case 'sign': confirmSheet(el.dataset.id,'accept'); break;
    case 'hand': {
      const c=car(el.dataset.id);if(!c)break;
      if(!c.signedAt){toast('Сначала отметьте подписанный акт приёма');break;}
      confirmSheet(el.dataset.id,'handover');break;
    }
    case 'confirm-act': {
      const c=car(el.dataset.id);if(!c)break;
      c.signedAt=Date.now();c.status='signed';c.sig=null;
      save();closeTop();render();toast('Акт подписан · машина в «Подписан»');break;
    }
    case 'confirm-hand': {
      const c=car(el.dataset.id);if(!c)break;
      c.handAt=Date.now();c.status='closed';c.closedAt=Date.now();c.handSig=null;
      save();closeTop();render();toast('Машина выдана');break;
    }
    case 'reopen': {const c=car(el.dataset.id);if(!c)break;c.status=c.signedAt?'signed':'draft';c.closedAt=null;c.handAt=null;c.handSig=null;save();render();toast('Возвращено в работу');break;}
    case 'stat-day': {statsDay=el.dataset.d;location.hash='#/stats';render();break;}
    case 'print-accept': printAccept(el.dataset.id); break;
    case 'print-hand': printHand(el.dataset.id); break;
    case 'share': {const c=car(el.dataset.id);if(c)shareSheet(carText(c));break;}
    case 'copy-share': {
      const t=$('#sh_text');
      if(t){t.select();try{document.execCommand('copy');toast('Скопировано');}catch(e){toast('Не удалось скопировать');}}
      break;
    }
    case 'save-me': S.me.name=$('#m_name').value.trim();S.me.phone=$('#m_phone').value.trim();save();render();toast('Сохранено');break;
    case 'reset': {
      if(!confirm('Удалить все машины с этого телефона?'))break;
      S=blank();save();location.hash='#/';render();toast('Всё очищено');break;
    }
  }
});

document.addEventListener('input',e=>{
  if(e.target&&e.target.id==='st_month'){statsMonth=e.target.value;render();return;}
  if(e.target&&e.target.id==='st_day'){statsDay=e.target.value;render();return;}
  if(e.target&&e.target.id==='q'){
    const q=e.target.value.trim().toLowerCase();
    $$('#carsList .item').forEach(it=>{
      const qq=it.dataset.q||'';
      it.style.display=(!q||qq.indexOf(q)>=0)?'':'none';
    });
  }
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeTop();});
window.addEventListener('hashchange',()=>{render();window.scrollTo(0,0);});

/* ================= boot ================= */
load();
render();
})();</script>
<script>
if('serviceWorker' in navigator){
  var hadController = !!navigator.serviceWorker.controller;
  var reloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', function(){
    if(!hadController || reloaded) return;
    reloaded = true;
    location.reload();
  });
  addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js').then(function(reg){ if(reg.update) reg.update(); }).catch(function(){});
  });
}
</script>
</body>
</html>
