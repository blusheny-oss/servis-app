<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E1116">
<meta name="description" content="Сервис — приёмка автомобиля: зоны, фото, отметки повреждений, подпись владельца, акт и смета.">
<title>Сервис — приёмка автомобилей</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
:root{
  --bg:#0E1116; --bg2:#12161C; --panel:#171C23; --panel2:#1E242C; --line:#2A313B;
  --ink:#EDF1F6; --muted:#96A3B4; --dim:#6C7889;
  --accent:#FFC24B; --accent-soft:#FFD37A; --accent-ink:#1A1405;
  --steel:#6FA8DC; --ok:#3BD67F; --bad:#FF6B6B; --info:#5AA9FF;
  --r:14px; --r-lg:18px;
  --fs-1:26px; --fs-2:19px; --fs-3:16px; --fs-4:14px; --fs-5:12.5px;
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
body{
  background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:var(--fs-4); line-height:1.5; -webkit-font-smoothing:antialiased;
  padding-bottom:calc(84px + env(safe-area-inset-bottom));
}
h1,h2,h3{line-height:1.25; letter-spacing:-.01em}
button,input,textarea,select{font:inherit; color:inherit}
a{color:inherit; text-decoration:none}
.money{font-variant-numeric:tabular-nums; letter-spacing:-.02em}
.muted{color:var(--muted)} .dim{color:var(--dim)}

/* chrome */
.topbar{position:sticky;top:0;z-index:30;background:rgba(14,17,22,.88);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.topbar .wrap{display:flex;align-items:center;gap:12px;height:60px}
.wrap{max-width:900px;margin:0 auto;padding:0 16px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:-.02em}
.brand-mark{width:32px;height:32px;border-radius:9px;flex:0 0 auto;background:linear-gradient(160deg,#FFD37A,#E8A21E);color:#1A1405;display:grid;place-items:center;font-weight:800;font-size:15px;box-shadow:0 2px 10px rgba(255,194,75,.25)}
.brand-sub{font-size:11px;font-weight:600;color:var(--dim);letter-spacing:.06em;text-transform:uppercase}
.topbar .spacer{flex:1}
.chip-btn{border:1px solid var(--line);background:var(--panel);color:var(--muted);height:34px;padding:0 12px;border-radius:999px;font-size:var(--fs-5);font-weight:600;display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.chip-btn:hover{color:var(--ink);border-color:#3A4655}

/* layout */
.app{padding-top:18px}
.section{margin-top:22px}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:10px}
.section-head h2{font-size:var(--fs-5);text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:700}
.section-head .lnk{font-size:var(--fs-5);color:var(--accent-soft);font-weight:600}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px}

/* KPI */
.kpi-hero{position:relative;overflow:hidden;background:linear-gradient(155deg,#20262F 0%,#171C23 58%,#1A2027 100%);border:1px solid #333B46;border-radius:var(--r-lg);padding:20px 18px 16px}
.kpi-hero::after{content:"";position:absolute;right:-40px;top:-40px;width:170px;height:170px;border-radius:50%;background:radial-gradient(circle,rgba(255,194,75,.16),transparent 68%)}
.kpi-hero .label{font-size:var(--fs-5);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.kpi-hero .value{font-size:34px;font-weight:800;margin:6px 0 4px;letter-spacing:-.03em}
.kpi-hero .sub{font-size:var(--fs-5);color:var(--muted)}
.kpi-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:13px 14px;display:flex;flex-direction:column}
.kpi .label{font-size:11.5px;color:var(--muted);font-weight:600}
.kpi .value{font-size:var(--fs-2);font-weight:700;margin-top:auto;padding-top:3px;letter-spacing:-.02em}
.kpi .value.ok{color:var(--ok)} .kpi .value.info{color:var(--info)} .kpi .value.acc{color:var(--accent)}

/* list */
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;cursor:pointer;transition:border-color .15s,background .15s}
.item:hover{border-color:#3B4757;background:var(--panel2)}
.item-main{min-width:0;flex:1}
.item-title{font-weight:600;font-size:var(--fs-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item-sub{font-size:var(--fs-5);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.item-side{text-align:right;flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.item-amount{font-weight:700;font-size:var(--fs-3);letter-spacing:-.02em}

/* pills */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;padding:3px 8px;border-radius:6px;white-space:nowrap;border:1px solid transparent}
.pill::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor}
.pill.draft{color:var(--dim);border-color:#33404F;background:#1B222C}
.pill.open{color:var(--accent);background:rgba(255,194,75,.12);border-color:rgba(255,194,75,.3)}
.pill.signed{color:var(--steel);background:rgba(111,168,220,.12);border-color:rgba(111,168,220,.3)}
.pill.closed{color:var(--ok);background:rgba(59,214,127,.11);border-color:rgba(59,214,127,.25)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:44px;padding:0 16px;border-radius:11px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);font-weight:600;font-size:var(--fs-4);cursor:pointer;transition:transform .08s,filter .15s,border-color .15s}
.btn:active{transform:scale(.985)}
.btn:hover{border-color:#3F4C5C}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.primary:hover{filter:brightness(1.05)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:rgba(255,107,107,.35);background:rgba(255,107,107,.07)}
.btn.sm{height:34px;padding:0 12px;font-size:var(--fs-5);border-radius:9px}
.btn.block{width:100%}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.actions .btn{flex:1 1 auto}
.actions .btn.wide{flex:1 1 100%}

/* tabbar */
.tabbar{position:fixed;bottom:0;left:0;right:0;z-index:40;background:rgba(17,22,29,.95);backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:8px 12px calc(8px + env(safe-area-inset-bottom));display:flex;justify-content:center}
.tabbar .inner{display:flex;width:100%;max-width:520px;gap:4px}
.tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 4px;border-radius:11px;color:var(--dim);font-size:10.5px;font-weight:600}
.tabbar a.on{color:var(--accent);background:rgba(255,194,75,.09)}
.tabbar svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabbar .mid{max-width:64px}
.tabbar .mid .dot{width:38px;height:38px;margin-top:-14px;border-radius:13px;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);box-shadow:0 6px 16px rgba(255,194,75,.28)}
.tabbar .mid .dot svg{width:22px;height:22px;stroke-width:2.4}

/* empty */
.empty{text-align:center;padding:34px 18px;border:1px dashed #33404F;border-radius:var(--r);background:rgba(23,28,35,.5)}
.empty h3{font-size:var(--fs-3);margin-bottom:6px}
.empty p{color:var(--muted);font-size:var(--fs-5);max-width:34ch;margin:0 auto 14px}

/* page head */
.page-head{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.back{width:38px;height:38px;flex:0 0 auto;border-radius:11px;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;cursor:pointer;color:var(--muted)}
.back:hover{color:var(--ink)}
.back svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.crumb{font-size:var(--fs-5);color:var(--dim);text-transform:uppercase;letter-spacing:.07em;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.page-title{font-size:var(--fs-1);font-weight:800;letter-spacing:-.03em;margin:2px 0 0}
.meta-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.meta{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.meta .k{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.meta .v{font-weight:600;margin-top:2px}

/* car scheme + zones */
.scheme{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-top:12px}
.scheme svg{display:block;width:100%;max-width:240px;height:auto;margin:0 auto}
.zone-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.zone{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:11px 12px;cursor:pointer;display:flex;align-items:center;gap:10px;text-align:left}
.zone:hover{border-color:#3B4757;background:var(--panel2)}
.zone .dot{width:9px;height:9px;border-radius:50%;background:#3A4453;flex:0 0 auto}
.zone.has .dot{background:var(--accent)}
.zone .t{flex:1;min-width:0;font-weight:600;font-size:13.5px}
.zone .c{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}

/* photos */
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.photo{position:relative;aspect-ratio:1;border-radius:11px;overflow:hidden;border:1px solid var(--line);background:#0B0E12}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.photo .del{position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:7px;border:none;background:rgba(8,10,13,.72);color:#fff;font-size:14px;line-height:1;cursor:pointer;display:grid;place-items:center}
.photo.add{display:grid;place-items:center;border-style:dashed;color:var(--dim);cursor:pointer;background:transparent}
.photo.add:hover{color:var(--accent);border-color:var(--accent)}
.photo.add span{font-size:22px;line-height:1}

/* marks */
.marks{display:flex;flex-wrap:wrap;gap:8px;margin-top:2px}
.mark{border:1px solid var(--line);background:var(--panel2);color:var(--muted);border-radius:999px;padding:8px 13px;font-size:13px;font-weight:600;cursor:pointer}
.mark.on{border-color:var(--accent);background:rgba(255,194,75,.14);color:var(--accent)}

/* sheet */
.backdrop{position:fixed;inset:0;z-index:60;background:rgba(6,8,11,.72);backdrop-filter:blur(3px);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:520px;background:var(--bg2);border:1px solid var(--line);border-radius:20px 20px 0 0;max-height:92vh;display:flex;flex-direction:column;animation:up .22s cubic-bezier(.2,.8,.3,1)}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
.grabber{width:38px;height:4px;border-radius:99px;background:#3A4655;margin:9px auto 0;flex:0 0 auto}
.sheet-head{padding:14px 18px 8px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.sheet-head h3{font-size:var(--fs-2);font-weight:700}
.sheet-body{padding:6px 18px 4px;overflow:auto;flex:1;min-height:0}
.sheet-foot{padding:12px 18px calc(16px + env(safe-area-inset-bottom));display:flex;gap:8px;border-top:1px solid var(--line);background:var(--bg2)}
.sheet-foot .btn{flex:1}
.x{border:none;background:transparent;color:var(--dim);font-size:22px;line-height:1;cursor:pointer;padding:4px 6px}

/* fields */
.field{margin-bottom:11px}
.field label{display:block;font-size:var(--fs-5);font-weight:600;color:var(--muted);margin-bottom:5px}
.field input,.field textarea,.field select{width:100%;background:#0F141A;border:1px solid var(--line);border-radius:11px;padding:11px 13px;font-size:16px;color:var(--ink);outline:none;transition:border-color .15s,box-shadow .15s}
.field select{appearance:none;-webkit-appearance:none;padding-right:34px;background-repeat:no-repeat;background-position:right 13px center;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'><path d='M1 1l5 5 5-5' fill='none' stroke='%2396A3B4' stroke-width='1.8' stroke-linecap='round'/></svg>")}
.field textarea{min-height:64px;resize:vertical;line-height:1.5}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(255,194,75,.15)}
.field input.err,.field textarea.err{border-color:var(--bad)}
.field .msg{font-size:11.5px;color:var(--bad);margin-top:4px;display:none}
.field.invalid .msg{display:block}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hint{font-size:var(--fs-5);color:var(--dim);line-height:1.5}

/* signature */
.sigwrap{background:#0B0F14;border:1px solid var(--line);border-radius:12px;overflow:hidden;touch-action:none}
.sigwrap canvas{display:block;width:100%;height:170px;touch-action:none;cursor:crosshair}
.sigline{display:flex;justify-content:space-between;font-size:11px;color:var(--dim);padding:6px 10px;border-top:1px dashed #2E3A48}

/* toast */
#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:#232C38;border:1px solid #3A4655;color:var(--ink);padding:10px 16px;border-radius:11px;font-size:var(--fs-5);font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.45)}

/* print */
#printRoot{display:none}
@media print{
  @page{size:A4;margin:14mm}
  body{background:#fff;padding:0;color:#111}
  .app,.topbar,.tabbar,#toast,.backdrop{display:none!important}
  #printRoot{display:block!important}
}
.doc{color:#111;font-family:Arial,Helvetica,sans-serif;font-size:11pt;line-height:1.45}
.doc h1{font-size:15pt;margin-bottom:2px}
.doc .doc-top{display:flex;justify-content:space-between;border-bottom:2px solid #111;padding-bottom:8px;margin-bottom:14px}
.doc .who{font-size:9.5pt;color:#333;text-align:right;max-width:46%}
.doc h2{font-size:11pt;margin:14px 0 6px;text-transform:uppercase;letter-spacing:.05em}
.doc .kv{display:flex;gap:8px;margin-bottom:3px}
.doc .kv b{font-weight:700;min-width:120px;display:inline-block}
.doc table{width:100%;border-collapse:collapse;margin-top:6px}
.doc th,.doc td{border:1px solid #999;padding:6px 8px;text-align:left;font-size:9.5pt;vertical-align:top}
.doc th{background:#eee;font-weight:700}
.doc td.num,.doc th.num{text-align:right;white-space:nowrap}
.doc tfoot td{font-weight:700;background:#f6f6f6}
.doc .note{margin-top:12px;font-size:9pt;color:#333;line-height:1.5}
.doc .signs{display:flex;gap:30px;margin-top:26px;page-break-inside:avoid}
.doc .signs>div{flex:1}
.doc .signs .ln{border-bottom:1px solid #111;height:44px;display:flex;align-items:flex-end;padding-bottom:2px}
.doc .signs .ln img{height:42px;display:block}
.doc .signs .cap{font-size:8.5pt;color:#444;margin-top:4px;display:flex;justify-content:space-between;gap:8px}
</style>
</head>
<body>

<header class="topbar">
  <div class="wrap">
    <div class="brand">
      <div class="brand-mark">С</div>
      <div>
        <div>Сервис</div>
        <div class="brand-sub" id="tbSub">приёмка автомобилей</div>
      </div>
    </div>
    <div class="spacer"></div>
    <button class="chip-btn" id="tbPlan" type="button">Тариф</button>
  </div>
</header>

<main class="app wrap" id="app"></main>
<div id="sheetHost"></div>
<div id="toast" aria-live="polite"></div>
<div id="printRoot"></div>

<script>(()=>{
'use strict';
/* ================= utils ================= */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const E={'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'};
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>E[c]);
const uid=()=>Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-3);
const nOf=v=>{const x=parseFloat(String(v==null?'':v).replace(',','.').replace(/\s/g,''));return isFinite(x)?x:0;};
const num=n=>Math.round(Number(n)||0);
const fmt=n=>num(n).toLocaleString('ru-RU')+' ₽';
const dmy=ts=>ts?new Date(ts).toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit',year:'numeric'}):'—';
const dts=ts=>ts?new Date(ts).toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'—';
const plural=(n,a,b,c)=>{const m=Math.abs(n)%100,k=m%10;return m>10&&m<20?c:k===1?a:k>1&&k<5?b:c;};
const fmtPhone=v=>{const d=String(v||'').replace(/\D/g,'');return (d.length===11&&d[0]==='7')?'+7 ('+d.slice(1,4)+') '+d.slice(4,7)+'-'+d.slice(7,9)+'-'+d.slice(9):(v||'');};

/* ================= zones ================= */
const ZONES=[
  {k:'front',t:'Передний бампер',x:50,y:99},
  {k:'hood',t:'Капот',x:50,y:85},
  {k:'left',t:'Левый борт',x:29,y:62},
  {k:'roof',t:'Крыша',x:50,y:52},
  {k:'right',t:'Правый борт',x:71,y:62},
  {k:'rear',t:'Задний бампер',x:50,y:15},
  {k:'glass',t:'Стёкла',x:50,y:70},
  {k:'wheels',t:'Диски и шины',x:18,y:74},
  {k:'salon',t:'Салон',x:50,y:44}
];
const MARKS=['царапина','вмятина','скол','трещина','потёртость','ржавчина'];

/* ================= photo store ================= */
const PhotoDB=(()=>{let p=null;
  const open=()=>p||(p=new Promise((res,rej)=>{const r=indexedDB.open('priemka',1);
    r.onupgradeneeded=()=>{r.result.createObjectStore('p');};
    r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);}));
  return{
    async put(id,v){try{const db=await open();return await new Promise((res,rej)=>{const t=db.transaction('p','readwrite');t.objectStore('p').put(v,id);t.oncomplete=()=>res(1);t.onerror=()=>rej(t.error);});}catch(e){return 0;}},
    async get(id){try{const db=await open();return await new Promise(res=>{const r=db.transaction('p').objectStore('p').get(id);r.onsuccess=()=>res(r.result||null);r.onerror=()=>res(null);});}catch(e){return null;}}
  };})();

/* ================= state ================= */
const KEY='priemka.v1';
const LIMIT=5;
const STATUS={draft:'Осмотр',signed:'Подписан',closed:'Выдан'};
let S=null, draftPhotos=[];

function blank(){return{v:1,pro:false,me:{name:'',phone:''},cars:[]};}
function load(){try{const raw=localStorage.getItem(KEY);if(raw){S=Object.assign(blank(),JSON.parse(raw));S.me=Object.assign(blank().me,S.me||{});return;}}catch(e){}
  S=blank();seed();save();}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){toast('Хранилище переполнено');}}
function seed(){
  const now=Date.now(),D=86400000;
  S.me={name:'СТО «Гараж 12»',phone:'+7 916 200-10-10'};
  S.cars=[
    {id:'a1',plate:'А 427 ВК 77',model:'Toyota Camry',vin:'XW7BF4FK20S012345',owner:'Сергей П.',phone:'+79161112233',mileage:'84 200',createdAt:now-2*3600e3,status:'draft',note:'Кузовной ремонт после парковки',zones:{left:{photos:[],marks:{'царапина':2,'вмятина':1},note:'Задняя дверь и крыло'}},works:[{id:'w1',title:'Покраска двери',qty:1,price:8000},{id:'w2',title:'Рихтовка крыла',qty:1,price:4500}]},
    {id:'a2',plate:'М 908 ТС 50',model:'Kia Rio',vin:'Z94CB41AAJR123456',owner:'Ольга Т.',phone:'+79035554433',mileage:'121 500',createdAt:now-D,status:'signed',signedAt:now-D+3600e3,sig:{name:'Ольга Т.',at:now-D+3600e3,data:''},zones:{rear:{photos:[],marks:{'скол':1},note:'Скол на бампере'}},works:[{id:'w3',title:'Замена заднего бампера',qty:1,price:12500}]}
  ];

function pickPhotos(){
  const inp=document.createElement('input');inp.type='file';inp.accept='image/*';inp.multiple=true;
  inp.addEventListener('change',async()=>{
    const files=Array.from(inp.files||[]).slice(0,6-draftPhotos.length);
    if(!files.length)return;
    for(const f of files){try{const data=await compress(f);const id='ph_'+uid();await PhotoDB.put(id,data);draftPhotos.push(id);}catch(e){toast('Фото не прочиталось');}}
    const box=$('#z_photos');if(box)renderDraftPhotos(box);
  });
  inp.click();
}
function compress(file,max,quality){
  max=max||1000;quality=quality||0.62;
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file);const img=new Image();
    img.onload=()=>{
      const sc=Math.min(1,max/Math.max(img.width,img.height));
      const w=Math.max(1,Math.round(img.width*sc)),hh=Math.max(1,Math.round(img.height*sc));
      const cv=document.createElement('canvas');cv.width=w;cv.height=hh;
      cv.getContext('2d').drawImage(img,0,0,w,hh);URL.revokeObjectURL(url);
      try{res(cv.toDataURL('image/jpeg',quality));}catch(e){rej(e);}
    };
    img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('img'));};
    img.src=url;
  });
}
function renderDraftPhotos(box){
  box.innerHTML=draftPhotos.map((id,i)=>'<div class="photo">'+photoTag(id)+'<button class="del" data-act="del-photo" data-i="'+i+'" aria-label="Удалить">×</button></div>').join('')

  hydratePhotos();
}

  const renderMarks=()=>MARKS.map(m=>{
    const n=marks[m]||0;
    return '<button class="mark '+(n?'on':'')+'" data-m="'+m+'">'+m+(n?' · '+n:'')+'</button>';
  }).join('');
  openSheet({
    title:zdef.t,
    body:'<div class="hint" style="margin-bottom:10px">Нажмите на повреждение — каждое нажатие добавляет одну отметку.</div>'
      +'<div class="marks" id="z_marks">'+renderMarks()+'</div>'
      +'<div class="field" style="margin-top:12px"><label for="z_note">Примечание</label><input id="z_note" value="'+esc(z.note||'')+'" placeholder="Задняя дверь и крыло"></div>'
      +'<div class="field" style="margin-bottom:2px"><label>Фото зоны — до 6</label><div class="photos" id="z_photos"></div></div>',
    foot:'<button class="btn ghost" data-act="close-sheet">Отмена</button><button class="btn primary" id="z_save">Готово</button>',
    onMount:(bd,close)=>{
      renderDraftPhotos($('#z_photos',bd));
      $('#z_marks',bd).addEventListener('click',e=>{
        const b=e.target.closest('[data-m]');if(!b)return;
        const m=b.dataset.m;marks[m]=((marks[m]||0)+1)%6;
        $('#z_marks',bd).innerHTML=renderMarks();
      });
      $('#z_save',bd).onclick=()=>{
        c.zones[zk]={photos:draftPhotos.slice(),marks:Object.fromEntries(Object.entries(marks).filter(([k,v])=>v>0)),note:$('#z_note',bd).value.trim()};
        save();close();render();
      };
    }
  });
}

function workForm(cid,wid){
  const c=car(cid);if(!c)return;
  const w=wid?c.works.find(x=>x.id===wid):{title:'',qty:1,price:''};
  openSheet({
    title:wid?'Работа':'Новая работа',
    body:'<div class="field" data-f="t"><label for="w_title">Что делаем</label><input id="w_title" value="'+esc(w.title)+'" placeholder="Покраска двери"><div class="msg">Назовите работу</div></div>'
      +'<div class="grid2"><div class="field"><label for="w_qty">Кол-во</label><input id="w_qty" inputmode="decimal" value="'+esc(w.qty)+'"></div>'
      +'<div class="field" data-f="p"><label for="w_price">Цена, ₽</label><input id="w_price" inputmode="numeric" value="'+esc(w.price)+'" placeholder="0"><div class="msg">Укажите цену</div></div></div>',
    foot:'<button class="btn ghost" data-act="close-sheet">Отмена</button><button class="btn primary" id="w_save">Сохранить</button>',
    onMount:(bd,close)=>{
      $('#w_save',bd).onclick=()=>{
        const title=$('#w_title',bd).value.trim(),price=nOf($('#w_price',bd).value);
        let bad=false;
        if(!title){$('[data-f="t"]',bd).classList.add('invalid');bad=true;}
        if(!price){$('[data-f="p"]',bd).classList.add('invalid');bad=true;}
        if(bad)return;
        const data={title,qty:nOf($('#w_qty',bd).value)||1,price};
        if(wid)Object.assign(w,c.works.find(x=>x.id===wid)||{},data);
        else c.works.push(Object.assign({id:'w_'+uid()},data));
        if(wid){const t=c.works.find(x=>x.id===wid);Object.assign(t,data);}
        save();close();render();
      };
    }
  });
}

function signSheet(cid){
  const c=car(cid);if(!c)return;
  openSheet({
    title:'Подпись владельца',
    body:'<p class="hint" style="margin-bottom:12px">Владелец подтверждает, что перечисленные повреждения зафиксированы до начала работ.</p>'
      +'<div class="card" style="margin-bottom:12px"><div style="font-weight:600">'+esc(c.plate)+' · '+esc(c.model||'')+'</div>'
      +'<div class="hint">'+zonesFilled(c)+' '+plural(zonesFilled(c),'зона','зоны','зон')+' с отметками · '+marksCount(c)+' '+plural(marksCount(c),'повреждение','повреждения','повреждений')+'</div></div>'
      +'<div class="field"><label for="s_name">ФИО владельца</label><input id="s_name" value="'+esc((c.sig&&c.sig.name)||c.owner||'')+'" placeholder="Сергей Петров"></div>'
      +'<div class="sigwrap"><canvas id="sigpad"></canvas><div class="sigline"><span>подпись владельца</span><span id="sigclear" style="cursor:pointer">очистить</span></div></div>',
    foot:'<button class="btn ghost" data-act="close-sheet">Отмена</button><button class="btn primary" id="s_save">Подписать</button>',
    onMount:(bd,close)=>{
      const cv=$('#sigpad',bd),ctx=cv.getContext('2d');
      const dpr=Math.min(window.devicePixelRatio||1,2);
      const r=cv.getBoundingClientRect();
      cv.width=Math.round((r.width||300)*dpr);cv.height=Math.round((r.height||170)*dpr);
      ctx.setTransform(dpr,0,0,dpr,0,0);ctx.lineWidth=2.2;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#111';
      let drawing=false,dirty=false;
      const pos=e=>{const rr=cv.getBoundingClientRect();return{x:e.clientX-rr.left,y:e.clientY-rr.top};};
      cv.addEventListener('pointerdown',e=>{e.preventDefault();drawing=true;const p=pos(e);ctx.beginPath();ctx.moveTo(p.x,p.y);try{cv.setPointerCapture(e.pointerId);}catch(_){}});
      cv.addEventListener('pointermove',e=>{if(!drawing)return;e.preventDefault();const p=pos(e);ctx.lineTo(p.x,p.y);ctx.stroke();dirty=true;});
      cv.addEventListener('pointerup',()=>{drawing=false;});
      cv.addEventListener('pointercancel',()=>{drawing=false;});
      $('#sigclear',bd).onclick=()=>{ctx.clearRect(0,0,cv.width,cv.height);dirty=false;};
      $('#s_save',bd).onclick=()=>{
        if(!dirty){toast('Сначала поставьте подпись');return;}
        const name=$('#s_name',bd).value.trim();
        if(!name){$('#s_name',bd).classList.add('err');$('#s_name',bd).focus();return;}
        c.sig={name,at:Date.now(),data:cv.toDataURL('image/png')};
        c.signedAt=Date.now();c.status='signed';
        save();close();render();toast('Акт подписан');
      };
    }
  });
}

/* ================= share ================= */
function carText(c){
  const L=['Осмотр автомобиля',''];
  L.push(c.plate+(c.model?' · '+c.model:''));
  if(c.owner)L.push('Владелец: '+c.owner);
  const zs=ZONES.filter(z=>zoneHas(c.zones[z.k]));
  if(zs.length){L.push('');zs.forEach(z=>{const zz=c.zones[z.k];const m=Object.entries(zz.marks||{}).filter(([k,v])=>v>0).map(([k,v])=>k+(v>1?' ×'+v:'')).join(', ');L.push('• '+z.t+': '+(m||'фото'));});}
  else L.push('Повреждений не зафиксировано.');
  if(c.works.length){L.push('');L.push('Смета: '+fmt(worksSum(c)));}
  L.push('');L.push((S.me.name||'Сервис')+(S.me.phone?' · '+S.me.phone:''));
  return L.join('\n');
}
function shareSheet(text){
  openSheet({
    title:'Сообщение владельцу',
    body:'<div class="field"><textarea id="sh_text" style="min-height:180px;font-size:14px">'+esc(text)+'</textarea></div>'
      +'<div class="hint">Кнопка копирует текст и открывает мессенджер — вставьте в чат. Акт с подписью — «Акт PDF» → «Сохранить как PDF».</div>',
    foot:'<button class="btn primary" id="sh_max">Отправить в MAX</button><button class="btn ghost" id="sh_copy">Скопировать</button>',
    onMount:(bd)=>{
      const ta=$('#sh_text',bd);
      $('#sh_copy',bd).onclick=()=>copyText(ta.value);
      $('#sh_max',bd).onclick=()=>{copyText(ta.value,'Текст в буфере — вставьте в чат MAX');window.open('https://max.ru','_blank','noopener');};
    }
  });
}

/* ================= print ================= */
const ACT_NOTE='Владелец подтверждает, что перечисленные повреждения и комплектность зафиксированы при передаче автомобиля в сервис. Повреждения, не указанные в настоящем акте, считаются отсутствовавшими на момент приёмки. Автомобиль передан без претензий по зафиксированным позициям.';
function printAct(id){
  const c=car(id);if(!c)return;
  const me=S.me;
  const rows=ZONES.filter(z=>zoneHas(c.zones[z.k])).map(z=>{
    const zz=c.zones[z.k];
    const m=Object.entries(zz.marks||{}).filter(([k,v])=>v>0).map(([k,v])=>k+(v>1?' ×'+v:'')).join(', ');
    const ph=(zz.photos||[]).length;
    return '<tr><td>'+esc(z.t)+'</td><td>'+esc(m||'—')+'</td><td>'+esc(zz.note||'')+'</td><td class="num">'+(ph?ph:'—')+'</td></tr>';
  }).join('');
  const works=c.works.map((w,i)=>'<tr><td>'+(i+1)+'</td><td>'+esc(w.title)+'</td><td class="num">'+esc(w.qty)+'</td><td class="num">'+fmt(w.price)+'</td><td class="num">'+fmt(num(nOf(w.qty)*nOf(w.price)))+'</td></tr>').join('');
  const html='<div class="doc">'
   +'<div class="doc-top"><div><h1>Акт приёма-передачи<br>автомобиля в сервис</h1>'
   +'<div style="font-size:9.5pt;color:#444;margin-top:4px">№ '+esc('АП-'+c.id.slice(-6).toUpperCase())+' от '+dmy(c.createdAt)+'</div></div>'
   +'<div class="who"><b>Сервис:</b><br>'+esc(me.name||'—')+(me.phone?'<br>'+esc(me.phone):'')+'</div></div>'
   +'<div class="kv"><b>Автомобиль:</b><span>'+esc(c.model||'—')+', гос. номер '+esc(c.plate)+'</span></div>'
   +(c.vin?'<div class="kv"><b>VIN:</b><span>'+esc(c.vin)+'</span></div>':'')
   +(c.mileage?'<div class="kv"><b>Пробег:</b><span>'+esc(c.mileage)+' км</span></div>':'')
   +'<div class="kv"><b>Владелец:</b><span>'+esc(c.owner||'—')+(c.phone?' · '+esc(c.phone):'')+'</span></div>'
   +'<h2>Зафиксированные повреждения</h2>'
   +(rows?'<table><thead><tr><th>Зона</th><th>Повреждения</th><th>Примечание</th><th class="num">Фото</th></tr></thead><tbody>'+rows+'</tbody></table>'
          :'<div style="font-size:10pt;padding:8px 0">Повреждений не выявлено.</div>')
   +(works?'<h2>Смета работ</h2><table><thead><tr><th style="width:24px">№</th><th>Работа</th><th class="num" style="width:60px">Кол-во</th><th class="num" style="width:90px">Цена</th><th class="num" style="width:100px">Сумма</th></tr></thead><tbody>'+works+'</tbody><tfoot><tr><td colspan="4">Итого</td><td class="num">'+fmt(worksSum(c))+'</td></tr></tfoot></table>':'')
   +'<div class="note">'+ACT_NOTE+'</div>'
   +'<div class="signs">'
   +'<div><div class="ln"></div><div class="cap"><span>Сдал (владелец)</span><span>'+esc((c.sig&&c.sig.name)||c.owner||'')+'</span></div></div>'
   +'<div><div class="ln">'+((c.sig&&c.sig.data)?'<img src="'+c.sig.data+'" alt="">':'')+'</div><div class="cap"><span>Принял (сервис)</span><span>'+esc(me.name||'')+'</span></div></div>'
   +'</div></div>';
  $('#printRoot').innerHTML=html;
  setTimeout(()=>window.print(),80);
}

/* ================= actions ================= */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const act=el.dataset.act;
  if(el.tagName==='A')e.preventDefault();
  switch(act){
    case 'go': location.hash=el.dataset.to; break;
    case 'back': history.back(); break;
    case 'close-sheet': closeTop(); break;
    case 'new-car': carForm(null); break;
    case 'edit-car': carForm(el.dataset.id); break;
    case 'zone': zoneSheet(el.dataset.id,el.dataset.z); break;
    case 'add-work': workForm(el.dataset.id,null); break;
    case 'edit-work': workForm(el.dataset.id,el.dataset.w); break;
    case 'sign': signSheet(el.dataset.id); break;
    case 'print': printAct(el.dataset.id); break;
    case 'share': {const c=car(el.dataset.id);if(c)shareSheet(carText(c));break;}
    case 'close-car': {const c=car(el.dataset.id);if(!c)break;if(!c.signedAt){toast('Сначала подпишите акт');break;}c.status='closed';c.closedAt=Date.now();save();render();toast('Машина выдана');break;}
    case 'reopen': {const c=car(el.dataset.id);if(!c)break;c.status=c.signedAt?'signed':'draft';save();render();toast('Возвращено в работу');break;}
    case 'del-car': {const c=car(el.dataset.id);if(c&&confirm('Удалить карточку '+c.plate+'?')){S.cars=S.cars.filter(x=>x.id!==c.id);save();location.hash='#/';render();toast('Удалено');}break;}
    case 'add-photo': pickPhotos(); break;
    case 'del-photo': {const i=+el.dataset.i;draftPhotos.splice(i,1);renderDraftPhotos($('#z_photos'));break;}
    case 'quick-add': carForm(null); break;
    case 'activate-pro': S.pro=true;save();closeTop();render();toast('Pro включён (демо)');break;
    case 'save-me': S.me.name=$('#m_name').value.trim();S.me.phone=$('#m_phone').value.trim();save();render();toast('Сохранено');break;
    case 'export': {const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='priemka-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000);toast('Копия скачана');break;}
    case 'import': {const inp=document.createElement('input');inp.type='file';inp.accept='.json,application/json';inp.onchange=async()=>{const f=inp.files&&inp.files[0];if(!f)return;try{const d=JSON.parse(await f.text());if(!Array.isArray(d.cars))throw new Error('bad');S=Object.assign(blank(),d);S.me=Object.assign(blank().me,d.me||{});save();render();toast('Данные загружены');}catch(err){toast('Файл не подошёл');}};inp.click();break;}
    case 'reset': {if(!confirm('Удалить все машины с этого устройства?'))break;S=blank();save();location.hash='#/';render();toast('Всё очищено');break;}
  }
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeTop();});
window.addEventListener('hashchange',()=>{render();window.scrollTo(0,0);});

/* ================= boot ================= */
load();

render();
})();</script>
